<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Excuse Clicker: Jesse's Justice</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

    body {
      margin: 0;
      padding: 0;
      background: #000;
      color: #0f0;
      font-family: 'Press Start 2P', monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow-x: hidden;
    }

    h1 {
      font-size: 28px;
      margin-top: 30px;
    }

    #gameArea {
      display: flex;
      align-items: flex-end;
      justify-content: space-around;
      width: 95%;
      max-width: 1000px;
      margin: 30px auto;
    }

    .sprite {
      width: 160px;
      height: 160px;
      background-color: #444;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 60px;
      border: 4px solid #0f0;
      transition: transform 0.3s ease-in-out;
    }

    .animateJesse {
      transform: scale(1.3) rotate(3deg);
    }

    #excuseBox, #quoteBox, #moneyMeter, #traumaMeter, #highScore {
      margin: 15px;
      padding: 20px;
      max-width: 95%;
      background: #111;
      border: 3px dashed #0ff;
      color: #0ff;
      font-size: 16px;
    }

    button {
      margin: 10px;
      font-size: 24px;
      padding: 30px 60px;
      background-color: #222;
      border: 4px solid #0f0;
      color: #0f0;
      cursor: pointer;
    }

    #overlay, #gameOver {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #000;
      color: #f0f;
      z-index: 999;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      text-align: center;
    }

    .carolinaDrop {
      animation: dropIn 1.2s ease-out;
    }

    @keyframes dropIn {
      0% { transform: translateY(-100vh); opacity: 0; }
      100% { transform: translateY(0); opacity: 1; }
    }
  </style>
</head>
<body>
  <h1>Excuse Clicker: Jesse's Justice</h1>
  <div id="counter">Excuses heard: 0</div>
  <div id="moneyMeter">Money Owed: $0</div>
  <div id="traumaMeter">Trauma Meter: 0</div>
  <div id="highScore">High Score: 0 excuses</div>

  <div id="gameArea">
    <div class="sprite" id="jesse">🧑‍⚖️</div>
    <div class="sprite" id="client">🧍</div>
  </div>

  <div id="excuseBox">Client: "My cousin borrowed the money."</div>
  <div id="quoteBox">Jesse: ""</div>

  <button onclick="handleClick()">Send 'Em Packing</button>
  <button onclick="forgiveDebt()">🙏 Forgive Debt</button>

  <div id="overlay"></div>
  <div id="gameOver"></div>

  <audio id="doomBell" src="https://actions.google.com/sounds/v1/alarms/dark_bell.ogg"></audio>

  <script>
    let count = 0;
    let money = 0;
    let trauma = 0;

    const jesseEl = document.getElementById("jesse");
    const traumaStories = [
      "I once wore wet socks for three days because I didn’t want to upset my grandma.",
      "My only birthday gift one year was a firm handshake.",
      "I thought a bee was my pet. Then it stung me.",
      "I lost my lunch money in a staring contest.",
      "I had to pretend I liked raisins for five years.",
      "My dad said I could be anything, so I became disappointing.",
      "We shared one pencil in a family of five.",
      "My favorite toy was a bottle cap named Greg.",
      "I got detention for hugging a tree.",
      "I cried once because the wind was too aggressive."
    ];

    const excuses = [...Array(50)].map((_, i) => `Excuse #${i + 1}: I made a terrible decision.`);

    const highScoreEl = document.getElementById("highScore");
    let highScore = localStorage.getItem("excuseHighScore") || 0;
    highScoreEl.innerText = `High Score: ${highScore} excuses`;

    function updateHighScore() {
      if (count > highScore) {
        highScore = count;
        localStorage.setItem("excuseHighScore", highScore);
      }
      highScoreEl.innerText = `High Score: ${highScore} excuses`;
    }

    function handleClick() {
      count++;
      money += 500;
      document.getElementById("counter").innerText = `Excuses heard: ${count}`;
      document.getElementById("moneyMeter").innerText = `Money Owed: $${money.toLocaleString()}`;

      const excuse = excuses[Math.floor(Math.random() * excuses.length)];
      document.getElementById("excuseBox").innerText = `Client: "${excuse}"`;

      if (count % 10 === 0) {
        const quote = `Jesse: \"Milestone #${count / 10}!\"`;
        document.getElementById("quoteBox").innerText = quote;
        jesseEl.classList.add("animateJesse");
        setTimeout(() => jesseEl.classList.remove("animateJesse"), 500);
      }

      updateHighScore();
    }

    function forgiveDebt() {
      const rand = Math.random();
      if (rand < 0.4) {
        const lalQuotes = [
          "I can’t go back to selling feet pics!!!!",
          "No more appetizers???!!!!????",
          "That’s ok, I didn’t like money anyway.",
          "We shared one breadstick for dinner last night.",
          "Do you know how expensive bubble tea is now??",
          "You gave up my poke bowl for *this*?",
          "I was saving up for sauce on my noodles.",
          "We split a single mozzarella stick yesterday.",
          "Our grocery list just says: ‘hope.’"
        ];
        const quote = lalQuotes[Math.floor(Math.random() * lalQuotes.length)];
        const overlay = document.getElementById("overlay");
        overlay.style.display = "flex";
        overlay.innerHTML = `<div style='font-size:200px;'>🧕</div><div style='margin-top:20px;font-size:28px;'>${quote}</div><div style='font-size:16px;margin-top:10px;color:#888;'>(Her shirt reads: \"We Need Money to Eat!\")</div>`;
        setTimeout(() => overlay.style.display = "none", 5000);
      } else {
        trauma++;
        document.getElementById("traumaMeter").innerText = `Trauma Meter: ${trauma}`;
        const story = traumaStories[(trauma - 1) % traumaStories.length];
        const overlay = document.getElementById("overlay");
        overlay.style.display = "flex";
        overlay.innerHTML = `<div style='font-size:120px;'>🧒</div><div style='margin-top:20px;font-size:24px;'>Billy: “This reminds me of when ${story}”</div>`;
        setTimeout(() => overlay.style.display = "none", 6000);

        if (trauma >= 10) {
          triggerGameOver();
        }
      }
    }

    function triggerGameOver() {
      const bell = document.getElementById("doomBell");
      if (bell) bell.play();

      const gameOver = document.getElementById("gameOver");
      gameOver.classList.add("carolinaDrop");
      gameOver.style.display = "flex";
      gameOver.innerHTML = `
        <div style='font-size:24px;'>Billy died.<br>Lal quit.<br>Erin went back to interior decorating.<br>Jesse was never heard from again.</div>
        <div style='font-size:60px; margin-top:20px;'>🧕 “Adiós, payasos!”</div>
      `;
    }
  </script>
</body>
</html>
