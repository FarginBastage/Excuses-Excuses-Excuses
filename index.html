<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Excuse Clicker: Jesse's Justice</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #111;
      color: #f0f0f0;
      font-family: 'Courier New', Courier, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow-x: hidden;
    }

    h1 {
      font-size: 36px;
      margin-top: 30px;
    }

    #gameArea {
      position: relative;
      display: flex;
      align-items: flex-end;
      justify-content: space-around;
      width: 95%;
      max-width: 1000px;
      margin: 30px auto;
    }

    .sprite {
      width: 160px;
      height: 160px;
      background-color: #333;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 80px;
      border: 4px solid #ccc;
      transition: transform 0.3s ease-in-out;
    }

    .animateJesse {
      transform: scale(1.3) rotate(3deg);
    }

    .straightToJail {
      position: absolute;
      font-size: 32px;
      color: red;
      font-weight: bold;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(1);
      animation: jailStamp 1.2s ease-out forwards;
      z-index: 10;
      text-shadow: 2px 2px 0 #000;
    }

    @keyframes jailStamp {
      0%   { transform: translate(-50%, -50%) scale(0); opacity: 0; }
      30%  { transform: translate(-50%, -50%) scale(1.2); opacity: 1; }
      100% { transform: translate(-50%, -50%) scale(1); opacity: 0; }
    }

    #excuseBox, #quoteBox, #moneyMeter, #traumaMeter, #highScore {
      margin: 15px;
      padding: 20px;
      max-width: 95%;
      background: #222;
      border: 2px solid #888;
      color: #f0f0f0;
      font-size: 18px;
    }

    button {
      margin: 10px;
      font-size: 24px;
      padding: 30px 60px;
      background-color: #444;
      border: 4px solid #888;
      color: #f0f0f0;
      cursor: pointer;
    }

    #overlay, #gameOver {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #000;
      color: #f0f0f0;
      z-index: 999;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      text-align: center;
    }

    .carolinaDrop {
      animation: dropIn 1.2s ease-out;
    }

    @keyframes dropIn {
      0% { transform: translateY(-100vh); opacity: 0; }
      100% { transform: translateY(0); opacity: 1; }
    }
  </style>
</head>
<body>
  <h1>Excuse Clicker: Jesse's Justice</h1>
  <div id="counter">Excuses heard: 0</div>
  <div id="moneyMeter">Money Owed: $0</div>
  <div id="traumaMeter">Trauma Meter: 0</div>
  <div id="highScore">High Score: 0 excuses</div>

  <div id="gameArea">
    <div class="sprite" id="jesse">🧑‍⚖️</div>
    <div class="sprite" id="client">🧍‍♀️</div>
  </div>

  <div id="excuseBox">Client: "My cousin borrowed the money."</div>
  <div id="quoteBox">Jesse: ""</div>

  <button onclick="handleClick()">Send 'Em Packing</button>
  <button onclick="forgiveDebt()">🙏 Forgive Debt</button>
  <button onclick="toggleSound()">🔊 Toggle Sound</button>

  <div id="overlay"></div>
  <div id="gameOver"></div>

  <audio id="scream" src="https://actions.google.com/sounds/v1/human_voices/wilhelm_scream.ogg"></audio>
  <audio id="siren" src="https://actions.google.com/sounds/v1/emergency/police_siren.ogg"></audio>
  <audio id="lalSound" src="https://actions.google.com/sounds/v1/human_voices/female_oops.ogg"></audio>
  <audio id="doomBell" src="https://actions.google.com/sounds/v1/alarms/dark_bell.ogg"></audio>
  <audio id="clickSound" src="https://actions.google.com/sounds/v1/cartoon/cartoon_boing.ogg"></audio>

  <script>
    let soundOn = true;
    function toggleSound() {
      soundOn = !soundOn;
      alert(`Sound is now ${soundOn ? 'ON' : 'OFF'}`);
    }
    function playSound(id) {
      if (!soundOn) return;
      const el = document.getElementById(id);
      if (el) {
        el.currentTime = 0;
        el.play();
      }
    }
  </script>
</body>
</html>
