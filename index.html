  <title>Excuse Clicker: Jesse's Justice</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #111;
      color: #f0f0f0;
      font-family: 'Courier New', Courier, monospace;
      font-weight: bold;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow-x: hidden;
    }

    h1 {
      font-size: 64px;
      margin-top: 30px;
    }

    #gameArea {
      position: relative;
      display: flex;
      align-items: flex-end;
      justify-content: space-around;
      width: 95%;
      max-width: 1000px;
      margin: 30px auto;
    }

    .sprite {
      width: 160px;
      height: 160px;
      background-color: #333;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 80px;
      border: 4px solid #ccc;
      transition: transform 0.3s ease-in-out;
    }

    .animateJesse {
      transform: scale(1.3) rotate(3deg);
    }

    .straightToJail {
      position: absolute;
      font-size: 64px;
      color: red;
      font-weight: bold;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(1);
      animation: jailStamp 1.2s ease-out forwards;
      z-index: 10;
      text-shadow: 2px 2px 0 #000;
    }

    @keyframes jailStamp {
      0%   { transform: translate(-50%, -50%) scale(0); opacity: 0; }
      30%  { transform: translate(-50%, -50%) scale(1.2); opacity: 1; }
      100% { transform: translate(-50%, -50%) scale(1); opacity: 0; }
    }

    #excuseBox, #quoteBox, #moneyMeter, #traumaMeter, #highScore {
      margin: 15px;
      padding: 30px;
      max-width: 95%;
      background: #222;
      border: 2px solid #888;
      color: #f0f0f0;
      font-size: 72px;
      font-weight: bold;
      text-align: center;
    }

    button {
      margin: 20px;
      font-size: 72px;
      padding: 40px 80px;
      background-color: #444;
      border: 4px solid #888;
      color: #f0f0f0;
      cursor: pointer;
      font-weight: bold;
    }

    #overlay, #gameOver {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #000;
      color: #f0f0f0;
      z-index: 999;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 72px;
      text-align: center;
      font-weight: bold;
    }

    .carolinaDrop {
      animation: dropIn 1.2s ease-out;
    }

    @keyframes dropIn {
      0% { transform: translateY(-100vh); opacity: 0; }
      100% { transform: translateY(0); opacity: 1; }
    }
  </style>
</head>

      overlay.innerHTML = `<div style='font-size:120px;'>🧒</div><div style='margin-top:20px;font-size:24px;'>Billy: “This reminds me of when ${story}”</div>`;
      playSound("scream");
      setTimeout(() => overlay.style.display = "none", 6000);
      if (trauma >= 10) {
        triggerGameOver();
      }
    }
  };

  function triggerGameOver() {
    playSound("doomBell");
    const gameOver = document.getElementById("gameOver");
    gameOver.classList.add("carolinaDrop");
    gameOver.style.display = "flex";
    gameOver.innerHTML = `
      <div style='font-size:24px;'>Billy died.<br>Lal quit.<br>Erin went back to interior decorating.<br>Jesse was never heard from again.</div>
      <div style='font-size:60px; margin-top:20px;'>🧍‍♀️ “Adiós, payasos!”</div>
    `;
  }
};
</script>
</body>
</html>
